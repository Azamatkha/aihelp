services:
  bot:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runbot"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  panel:
    build: .
    command: python -m waitress --listen=0.0.0.0:8000 config.wsgi:application
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - bot
    restart: unless-stopped